<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign In — TopG Algo</title>
<link rel="stylesheet" href="css/login.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body>

<div class="auth-wrapper">

  <!-- ===== Logo ===== -->
  <a href="../index.html" class="auth-logo">TOPG<span>ALGO</span></a>

  <!-- ===== Login Card ===== -->
  <div class="auth-card">
    <h1 class="auth-title">Welcome Back</h1>
    <p class="auth-subtitle">Sign in to access your trading dashboard.</p>

    <!-- Global error / success banner -->
    <div class="auth-banner" id="authBanner"></div>

    <form id="loginForm" novalidate>
      <!-- Email -->
      <div class="form-group">
        <label for="email">Email Address</label>
        <input type="email" id="email" name="email" placeholder="you@example.com" autocomplete="email">
        <span class="field-error" id="emailError"></span>
      </div>

      <!-- Password -->
      <div class="form-group">
        <label for="password">Password</label>
        <div class="password-field">
          <input type="password" id="password" name="password" placeholder="Enter your password" autocomplete="current-password">
          <button type="button" class="toggle-password" id="togglePassword" aria-label="Show password">
            <svg id="eyeIcon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
              <circle cx="12" cy="12" r="3"></circle>
            </svg>
          </button>
        </div>
        <span class="field-error" id="passwordError"></span>
      </div>

      <!-- Options row -->
      <div class="form-options">
        <label class="checkbox-label">
          <input type="checkbox" id="rememberMe">
          <span class="checkbox-custom"></span>
          Remember me
        </label>
        <a href="reset-password.html" class="forgot-link">Forgot password?</a>
      </div>

      <!-- Submit -->
      <button type="submit" class="btn-submit" id="submitBtn">
        <span class="btn-text">Sign In</span>
        <span class="btn-spinner" id="btnSpinner"></span>
      </button>
    </form>

    <p class="auth-footer-link">
      Don't have an account? <a href="signup.html">Apply for access</a>
    </p>
  </div>

  <!-- ===== Footer ===== -->
  <footer class="auth-footer">
    <a href="../index.html#faq">Privacy Policy</a>
    <span class="dot">•</span>
    <a href="../index.html#faq">Terms of Service</a>
    <span class="dot">•</span>
    <a href="../index.html#faq">Risk Disclosure</a>
  </footer>

</div>

<!-- Supabase SDK (connect backend later) -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/login.js"></script>
</body>
</html>
